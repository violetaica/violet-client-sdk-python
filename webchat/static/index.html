<!DOCTYPE html>
<!--
  Violet web-chat showcase — browser frontend.

  What this shows:
    A single self-contained page (inline CSS + vanilla JS, no build step, no
    external CDNs) that talks to the FastAPI SSE backend at POST /api/chat.
    It keeps a small client-side history array, streams the assistant reply
    token-by-token into the live bubble, and surfaces backend errors.

  Protocol (Server-Sent-Events framing over a fetch ReadableStream):
    The browser POSTs JSON {messages:[{role,content}, ...]} to /api/chat.
    The backend replies with text/event-stream lines, one frame per line:
        data: <chunk of assistant text>
        data: [DONE]                 -> stream finished cleanly
        data: [ERROR] <message>      -> backend/provider error
    We use fetch + a ReadableStream reader (not EventSource) so the turn's
    history travels in the request body instead of a long query string.

  How to run:
    Start the backend (serves this file as /) and open http://localhost:8000
    in a browser. See webchat/README.md for the FastAPI launch command.

  Prereqs: a paid workspace (Auth0 login or `VIOLET_API_KEY`); a
  one-time browser login happens on the first backend call. The gateway sets
  the served model — the client cannot choose it.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Violet Web Chat</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --user:#2a4d8f; --asst:#23272f;
          --text:#e7e9ee; --muted:#8b919e; --accent:#6ea8fe; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid #000;
           font-weight:600; }
  header small { color:var(--muted); font-weight:400; margin-left:8px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:72%; padding:9px 13px; border-radius:14px; white-space:pre-wrap;
         word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
  .asst { align-self:flex-start; background:var(--asst); border-bottom-left-radius:4px; }
  .err  { align-self:center; background:#3a1f22; color:var(--err); font-size:13px;
          border:1px solid var(--err); }
  .asst.streaming::after { content:'▋'; color:var(--accent); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--panel);
         border-top:1px solid #000; }
  #input { flex:1; resize:none; padding:10px 12px; border-radius:10px; border:1px solid #2c3140;
           background:#0c0e12; color:var(--text); font:inherit; }
  #input:focus { outline:1px solid var(--accent); }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--accent);
           color:#06122b; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<header>Violet Web Chat <small>streaming SSE demo</small></header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Type a message and press Enter…" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
  // Client-side conversation history, sent in full with every turn.
  const history = [];

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function bubble(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text || "";
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // Enter sends; Shift+Enter inserts a newline.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;

    input.value = "";
    bubble("user", text);
    history.push({ role: "user", content: text });

    const asst = bubble("asst streaming", "");
    send.disabled = true;
    let reply = "";

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (!resp.ok || !resp.body) {
        throw new Error("HTTP " + resp.status + " " + resp.statusText);
      }

      // Read the SSE stream and split it into "data: ..." frames.
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let done = false;

      while (!done) {
        const { value, done: streamDone } = await reader.read();
        if (streamDone) break;
        buffer += decoder.decode(value, { stream: true });

        let nl;
        while ((nl = buffer.indexOf("\n")) !== -1) {
          const line = buffer.slice(0, nl).replace(/\r$/, "");
          buffer = buffer.slice(nl + 1);
          if (!line.startsWith("data:")) continue;

          const data = line.slice(5).replace(/^ /, ""); // drop "data:" + optional space
          if (data === "[DONE]") { done = true; break; }
          if (data.startsWith("[ERROR]")) {
            throw new Error(data.slice(7).trim() || "stream error");
          }
          reply += data;
          asst.textContent = reply;
          log.scrollTop = log.scrollHeight;
        }
      }

      asst.classList.remove("streaming");
      if (reply) history.push({ role: "assistant", content: reply });
      else asst.textContent = "(no response)";
    } catch (err) {
      asst.classList.remove("streaming");
      if (!reply) asst.remove();         // nothing streamed: drop empty bubble
      history.pop();                      // roll back the failed user turn
      bubble("err", "Error: " + (err && err.message ? err.message : err));
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
